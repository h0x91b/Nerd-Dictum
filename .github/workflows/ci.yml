name: CI

on:
  pull_request:
    branches: ['*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivy-config: ''
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivy-config: ''
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        continue-on-error: true

      - name: Print Trivy results summary
        run: |
          echo "=============="
          echo "Trivy Security Scan Results"
          echo "=============="
          if [ -f trivy-results.json ]; then
            echo "Full results saved to trivy-results.json"
            echo ""
            echo "Summary:"
            jq -r '.Results[] | select(.Vulnerabilities != null) | "Target: \(.Target)\nVulnerabilities found: \(.Vulnerabilities | length)\n"' trivy-results.json || echo "No vulnerabilities data found"
            echo ""
            echo "Critical and High severity vulnerabilities:"
            jq -r '.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "- [\(.Severity)] \(.VulnerabilityID): \(.Title // .PkgName)"' trivy-results.json | head -20 || echo "No critical/high vulnerabilities found"
          else
            echo "Trivy results file not found"
          fi
          echo "=============="
        continue-on-error: true
