name: CI

on:
  pull_request:
    branches: ['*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivy-config: ''
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        continue-on-error: true

      - name: Post Trivy results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const helperModuleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/trivy-pr-comment.js`).href;
            const { readTrivyCommentAction, TRIVY_COMMENT_HEADER } = await import(helperModuleUrl);
            const action = readTrivyCommentAction('trivy-results.txt');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const trivyComment = comments.find(c => c.body.includes(TRIVY_COMMENT_HEADER));

            if (action.type === 'delete') {
              if (trivyComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: trivyComment.id,
                });
                console.log('Deleted stale Trivy comment because no vulnerabilities were found.');
              } else {
                console.log('No vulnerabilities found; skipping PR comment.');
              }
              return;
            }

            if (trivyComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: trivyComment.id,
                body: action.body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: action.body,
              });
            }
        continue-on-error: true
